<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LINEグループ名メーカー</title>
    <!-- Google Fonts - M PLUS Rounded 1c -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="gradient-bg"></div>
    <main class="app-container">
      <header class="hero">
        <h1>LINEグループ名メーカー</h1>
        <p>
          キーワードや雰囲気を入れるだけで、ぴったりのグループ名を提案します。
          AIでの生成も選べます♪
        </p>
      </header>

      <section class="controls" aria-label="グループ名生成フォーム">
        <form id="generator-form">
          <label for="keywords">キーワード・雰囲気</label>
          <input
            type="text"
            id="keywords"
            name="keywords"
            placeholder="例：部活 友情 ネタ"
            required
          />

          <label for="category">カテゴリ</label>
          <select id="category" name="category">
            <option value="trendy">おしゃれ系</option>
            <option value="cute">かわいい系</option>
            <option value="funny">ネタ系</option>
            <option value="cool">クール系</option>
            <option value="warm">ほっこり系</option>
          </select>

          <fieldset class="mode-switch">
            <legend>生成モード</legend>
            <label class="switch">
              <input type="checkbox" id="mode-toggle" />
              <span class="slider"></span>
            </label>
            <div class="mode-labels">
              <span id="random-label" class="active">🎲 ランダム</span>
              <span id="ai-label">🤖 AI</span>
            </div>
          </fieldset>

          <button type="submit" class="generate-btn">生成する</button>
        </form>

        <button id="regenerate" class="regenerate-btn" disabled>
          もう一度生成
        </button>
      </section>

      <section id="results" class="results" aria-live="polite"></section>
    </main>

    <footer class="footer">LINEグループ名メーカー ©2025</footer>

    <template id="result-card-template">
      <article class="result-card">
        <p class="group-name"></p>
        <button class="copy-btn" type="button">コピー</button>
      </article>
    </template>

    <script src="script.js"></script>
  </body>
</html>
